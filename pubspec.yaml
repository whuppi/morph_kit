name: adaptive_layouts
version: 0.0.0
description: >-
  Adaptive layout widgets that morph between phone and desktop forms —
  list-detail, split panes, slide-over details, draggable anchored
  dividers, and pane state that survives window resizes.
homepage: https://github.com/whuppi/adaptive_layouts
repository: https://github.com/whuppi/adaptive_layouts
issue_tracker: https://github.com/whuppi/adaptive_layouts/issues

topics:
  - layout
  - adaptive
  - responsive
  - list-detail
  - split-view

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
