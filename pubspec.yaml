name: morph_kit
version: 0.1.0
description: >-
  Adaptive, responsive layouts that morph between phone and desktop forms —
  list-detail, split view panes, dialog to bottom sheet modals — preserving
  live widget state across window resizes and breakpoint changes.
homepage: https://github.com/whuppi/morph_kit
repository: https://github.com/whuppi/morph_kit
issue_tracker: https://github.com/whuppi/morph_kit/issues

topics:
  - layout
  - adaptive
  - responsive
  - list-detail
  - split-view

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
