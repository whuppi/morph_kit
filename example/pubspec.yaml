name: morph_kit_example
description: >-
  Full-app demo of morph_kit: three domains behind an adaptive shell
  (bottom nav / rail), nested tab routers, URL-synced list-detail panes in
  overlay mode, and adaptive modals.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.11.0-0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  morph_kit:
    path: ../
  auto_route: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  auto_route_generator: ^10.0.0

flutter:
  uses-material-design: true
